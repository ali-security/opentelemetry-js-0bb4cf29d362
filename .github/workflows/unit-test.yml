name: Unit Tests
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - "18.19.0"
          - "18"
          - "20.6.0"
          - "20"
          - "22"
          - "24"
          - "25"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: ${{ matrix.node_version }}

      # npm@11.0.0 drops support for Node.js v18
      # Install the latest npm compatible with this version of Node.js
      # - npm@11.1.0 supports: {"node":"^20.17.0 || >=22.9.0"}
      - run: npm install -g npm@"<11.0.0"
        if: ${{
          matrix.node_version == '18.19.0' ||
          matrix.node_version == '18' ||
          matrix.node_version == '20.6.0'
          }}
      - run: npm install -g npm@11.6.0
        if: ${{
          matrix.node_version == '20' ||
          matrix.node_version == '22' ||
          matrix.node_version == '24' ||
          matrix.node_version == '25'
          }}

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - run: npm test
        if: ${{ matrix.node_version != '22' && matrix.node_version != '24' || matrix.node_version != '25' }}
      # Node.js type stripping conflicts with mocha usage of ts-node.
      # See https://github.com/open-telemetry/opentelemetry-js/issues/5415
      - run: npm test
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
        if: ${{ matrix.node_version == '22' || matrix.node_version == '24' || matrix.node_version == '25' }}

      - name: Pack @opentelemetry/core
        if: ${{ matrix.node_version == '22' }}
        run: |
          mkdir -p dist-artifact
          npm pack --workspace=packages/opentelemetry-core --pack-destination=dist-artifact
          mv dist-artifact/opentelemetry-core-*.tgz \
            dist-artifact/core-$(node -p "require('./packages/opentelemetry-core/package.json').version").tgz

      - name: Upload package tarball
        if: ${{ matrix.node_version == '22' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist-artifact/core-*.tgz
          if-no-files-found: error
  node-windows-tests:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: '22'

      - run: npm install -g npm@11.6.0

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: |
          npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"
          npm run compile

      - name: Unit tests
        run: npm run test
        env:
          NODE_OPTIONS: '--no-experimental-strip-types'
  browser-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:browser
  webworker-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
          node-version: 22

      - name: Bootstrap
        run: npm ci --ignore-scripts

      - name: Build 🔧
        run: npm run compile

      - name: Unit tests
        run: npm run test:webworker
